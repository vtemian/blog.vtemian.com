{{- /* The other way into a note: a red arrow drawn in the margin, pointing at
       the word. Same behaviour as the pencil, different mark, so a page can use
       both without turning into a page of circled phrases.
       &lbrace;&lbrace;< arrow "noteid" >}}the phrase&lbrace;&lbrace;< /arrow >}} */ -}}
<span role="button" tabindex="0" class="arrow" data-note="{{ .Get 0 }}" aria-expanded="false">{{ .Inner }}</span>
