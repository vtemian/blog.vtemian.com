{{- /* Three lanes, three cars. They run the same track at the same speed, the
       thought sets off first and the other two follow, so the gap you see at any
       moment is how far ahead the thinking is. */ -}}
<figure class="ml" aria-label="Three lanes: the thought sets off first, the voice follows, the hand last">
  <div class="ml-grid">
    <div class="ml-row">
      <span class="ml-ch" data-c="text" role="img" aria-label="thought"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
      <span class="ml-name">thought</span>
      <div class="ml-cells" data-c="text"></div>
    </div>
    <div class="ml-row">
      <span class="ml-ch" data-c="sound" role="img" aria-label="voice"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h2.4L8.6 3v10L5.4 10H3z" fill="currentColor"/><path d="M10.8 5.6a3.2 3.2 0 0 1 0 4.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span>
      <span class="ml-name">voice</span>
      <div class="ml-cells" data-c="sound"></div>
    </div>
    <div class="ml-row">
      <span class="ml-ch" data-c="draw" role="img" aria-label="hand"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.2 2.4l2.4 2.4-8 8L2.4 14l1.2-3.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
      <span class="ml-name">hand</span>
      <div class="ml-cells" data-c="draw"></div>
    </div>
  </div>
  <div class="cb-controls">
    <button class="cb-btn" data-act="toggle" aria-label="Play or pause">▶</button>
    <button class="cb-btn" data-act="replay" aria-label="Replay from the start">↺</button>
    <span class="cb-frame"></span>
    <span class="cb-hint">drag the frames</span>
  </div>
</figure>
<script>
(() => {
  const fig = [...document.querySelectorAll('.ml')].find(e => !e.dataset.ready);
  if (!fig) return;
  fig.dataset.ready = '1';

  const FRAMES = 88, MS = 55;

  // All three run at the same speed, one cell a tick. What differs is the
  // padding each one waits through before it sets off: the voice nine cells
  // behind the thought, the hand nine behind that. Same speed, so the gap it
  // starts with is the gap it keeps, and the thought crosses the end first.
  const DELAY = { text: 0, sound: 9, draw: 18 };

  // [laying anything, how many cells]. A lane covers the same ground either
  // way; the runs are where it puts something down. The thought works in short
  // frequent marks, the voice in phrases, the hand in long strokes.
  const LANES = {
    text:  [[0,2],[1,6],[0,2],[1,7],[0,3],[1,5],[0,2],[1,6],[0,3],[1,7],
            [0,2],[1,6],[0,3],[1,5],[0,2],[1,7],[0,3],[1,6],[0,4],[1,7]],
    sound: [[0,3],[1,10],[0,5],[1,9],[0,6],[1,11],[0,4],[1,8],[0,5],[1,10],[0,6],[1,11]],
    draw:  [[0,4],[1,12],[0,7],[1,14],[0,6],[1,11],[0,8],[1,13],[0,7],[1,6]],
  };

  const RUN = Math.max(...Object.entries(LANES)
    .map(([ch, plan]) => DELAY[ch] + plan.reduce((s, [, n]) => s + n, 0)));

  // Which cells a lane lays and on which tick, plus where its car is on every
  // tick. Before it sets off the car waits on the first cell, the way a car
  // waits on the grid.
  const rows = {};
  for (const [ch, plan] of Object.entries(LANES)) {
    const box = fig.querySelector(`.ml-cells[data-c="${ch}"]`);
    for (let i = 0; i < FRAMES; i++) box.appendChild(document.createElement('i'));

    const at = new Array(FRAMES).fill(-1);
    let c = 0;
    for (const [ink, n] of plan) {
      if (ink) for (let i = 0; i < n && c + i < FRAMES; i++) at[c + i] = DELAY[ch] + c + i;
      c += n;
    }
    const pos = new Array(RUN + 1);
    for (let t = 0; t <= RUN; t++) pos[t] = Math.max(0, Math.min(c - 1, t - DELAY[ch]));
    rows[ch] = { cells: [...box.children], at, pos };
  }

  const track = fig.querySelector('.ml-cells');
  const grid = fig.querySelector('.ml-grid');
  const controls = fig.querySelector('.cb-controls');
  const toggle = controls.querySelector('[data-act="toggle"]');
  const readout = controls.querySelector('.cb-frame');

  let tick = 0, playing = false, acc = 0, lastNow = 0, last = -1;
  const render = t => {
    tick = t;
    let lead = 0;
    for (const { cells, at, pos } of Object.values(rows)) {
      const car = Math.round(pos[Math.max(0, Math.min(RUN, t))]);
      for (let i = 0; i < FRAMES; i++) {
        cells[i].classList.toggle('is-past', at[i] >= 0 && at[i] <= t);
        cells[i].classList.toggle('is-car', i === car);
      }
      lead = Math.max(lead, car + 1);
    }
    readout.textContent = `${String(lead).padStart(3, ' ')} / ${FRAMES}`;
  };
  const setPlaying = on => {
    playing = on;
    toggle.textContent = on ? '❚❚' : '▶';
    toggle.setAttribute('aria-label', on ? 'Pause' : 'Play');
  };
  const play = from => {
    if (from != null) render(from);
    if (tick >= RUN) render(0);
    acc = tick * MS;
    last = -1;
    setPlaying(true);
  };
  toggle.addEventListener('click', () => { touched = true; playing ? setPlaying(false) : play(); });
  controls.querySelector('[data-act="replay"]').addEventListener('click', () => { touched = true; play(0); });

  // Dragging runs the whole race, not just the leader's part of it, so the far
  // right is the last car crossing rather than the first.
  const tickAt = x => {
    const r = track.getBoundingClientRect();
    return Math.max(0, Math.min(RUN, Math.round((x - r.left) / r.width * RUN)));
  };
  // Capture is a nicety, not the thing the drag depends on: if it throws the
  // drag still has to work.
  let dragging = false, touched = false;
  grid.addEventListener('pointerdown', e => {
    touched = true;
    setPlaying(false);
    dragging = true;
    try { grid.setPointerCapture(e.pointerId); } catch (_) {}
    render(tickAt(e.clientX));
    e.preventDefault();
  });
  grid.addEventListener('pointermove', e => { if (dragging) render(tickAt(e.clientX)); });
  for (const t of ['pointerup', 'pointercancel', 'pointerleave']) {
    grid.addEventListener(t, () => { dragging = false; });
  }

  const frame = now => {
    if (playing) {
      // Count the time this tab was actually drawing. Wall clock would run on
      // while the tab is hidden or the figure is off screen, and the race would
      // be over before anyone saw it.
      acc += Math.min(now - lastNow, 200);
      const t = Math.floor(acc / MS);
      if (t >= RUN) { render(RUN); setPlaying(false); }
      else if (t !== last) { last = t; render(t); }
    }
    lastNow = now;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(now => { lastNow = now; frame(now); });

  render(0);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) render(RUN);
  else {
    // Start it when the reader gets here, not when the page loads.
    // ...unless they got here first and started scrubbing it themselves.
    new IntersectionObserver((es, obs) => {
      if (!es.some(e => e.intersectionRatio > 0.5)) return;
      obs.disconnect();
      if (!touched) play(0);
    }, { threshold: [0, 0.5, 1] }).observe(fig);
  }
})();
</script>
