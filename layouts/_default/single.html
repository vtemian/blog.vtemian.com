{{ define "content" }}
<div class="mx-auto flex max-w-2xl flex-col gap-12 px-5 py-12">
    <a href="/" class="font-mono text-xs tracking-wide text-muted">Back</a>
    <article class="flex flex-col gap-12">
        <header class="flex flex-col gap-2">
            <h1 class="text-2xl">{{ .Title }}</h1>
            <p class="text-xs text-link">{{ .Date.Format "January 2006" }}</p>
        </header>
        <div class="flex flex-col gap-4">
            {{ .Content }}
        </div>
    </article>
    {{ partial "footer" .}}
</div>

<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    // Convert Hugo's ```mermaid fenced blocks into mermaid-renderable elements
    document.querySelectorAll('code.language-mermaid').forEach(el => {
        const pre = el.parentElement;
        const div = document.createElement('pre');
        div.className = 'mermaid';
        div.textContent = el.textContent;
        pre.parentElement.replaceChild(div, pre);
    });
    await mermaid.run();
</script>

<script>
    // Reveal blueprint diagrams (figure[data-dgm]) as they scroll into view.
    (function () {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var countUp = function (el) {
            var to = parseInt(el.getAttribute('data-to'), 10);
            var from = parseInt(el.getAttribute('data-from') || '0', 10);
            if (isNaN(to)) return;
            if (reduce) { el.textContent = to; return; }
            var dur = 1100, start = null;
            var step = function (ts) {
                if (start === null) start = ts;
                var p = Math.min(1, (ts - start) / dur);
                var eased = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(from + (to - from) * eased);
                if (p < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        };
        var obs = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('dgm-in');
                    entry.target.querySelectorAll('.dgm-count').forEach(countUp);
                    obs.unobserve(entry.target);
                }
            });
        }, { threshold: 0.2 });
        var register = function () {
            document.querySelectorAll('figure[data-dgm]:not(.dgm-in)').forEach(function (el) {
                obs.observe(el);
            });
        };
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', register);
        } else {
            register();
        }
    })();
</script>

{{ end }}
