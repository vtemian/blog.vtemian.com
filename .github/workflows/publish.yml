name: Deploy to GitHub Pages

on:
  push:
    branches:
      - content
  # GitHub dropped the push event for a8e9f01 and the site sat a commit behind
  # with no way to ask for a build. This is that way.
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build talks
      run: |
        cd talks
        npm install @marp-team/marp-cli
        make

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Generate OG images
      run: |
        pip install Pillow
        python scripts/gen_og.py

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.136.2'

    - name: Build
      run: hugo --gc --minify

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: master
        cname: blog.vtemian.com
